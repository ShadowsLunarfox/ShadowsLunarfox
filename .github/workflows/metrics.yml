name: Generate Metrics dashboard

on:
  schedule:
    # Every day at 00:37 in Kuala Lumpur (UTC+8).
    - cron: "37 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check Metrics configuration
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo '::notice::Add a METRICS_TOKEN repository secret to generate your dashboard. See .github/profile-widgets.md.'
          fi
      - name: Generate the terminal card
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          user: ${{ github.repository_owner }}
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/profile/metrics-terminal.svg
          template: terminal
          base: header, metadata
          config_timezone: Asia/Kuala_Lumpur
          config_animations: yes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_details: percentage
      - name: Generate achievements and coding insights
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          user: ${{ github.repository_owner }}
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/profile/metrics-insights.svg
          template: classic
          base: ""
          config_timezone: Asia/Kuala_Lumpur
          config_animations: yes
          config_order: achievements, habits, repositories
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 6
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_charts: yes
          plugin_repositories: yes
          plugin_repositories_pinned: 2
          extras_css: |
            h1, h2, h3 { color: #ff8fab; }
