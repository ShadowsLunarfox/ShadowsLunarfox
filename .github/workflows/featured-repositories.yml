name: Generate featured repositories

on:
  schedule:
    # Every day at 00:42 in Kuala Lumpur (UTC+8).
    - cron: "42 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/featured-repositories.json
      - .github/scripts/generate-repositories.cjs
      - .github/scripts/generate-repositories.test.cjs
      - .github/workflows/featured-repositories.yml

permissions:
  contents: write

concurrency:
  group: featured-repositories
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify repository selection and rendering
        run: node --test .github/scripts/generate-repositories.test.cjs
      - name: Generate individual repository cards
        run: node .github/scripts/generate-repositories.cjs
        env:
          PROFILE_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save the cards and update the profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/profile/repositories
          if ! git diff --cached --quiet; then
            git commit -m "Update featured repository cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
