name: Generate 3D contributions

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Generate contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json
      - name: Select the light and dark themes
        run: |
          mkdir -p assets/profile
          cp profile-3d-contrib/3d-contributions-light.svg assets/profile/3d-contributions-light.svg
          cp profile-3d-contrib/3d-contributions-dark.svg assets/profile/3d-contributions-dark.svg
      - name: Apply the shared language palette and font
        run: node .github/scripts/apply-profile-palette.cjs assets/profile/3d-contributions-light.svg assets/profile/3d-contributions-dark.svg
      - name: Save the updated calendars
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile/3d-contributions-light.svg assets/profile/3d-contributions-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update 3D contribution calendars"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
